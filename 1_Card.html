<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
    <style>
        *{
            margin: 0;
            padding: 0;

        }
        body{
            background-color: grey;
            padding: 45px;
        }
        .card{
            background-color: silver;
            width: 198px;
            height: 344px;
            border-radius: 7px;

        }
        .image{
            padding:5px ;
            
        }
        .image img{
            border-radius: 7px;
        }
        
        .content p{
            font-size: 11px;
            color: black;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }
        .content{
            padding: 10px 12px;
        }
        .capsules{
            padding: 0 34px 0 14px;

        }
        .capsules span{
            border: 1px solid gray;
            padding: 0px 6px;
            border-radius: 15px;
            font-size: 10px;
            font-family: Georgia, 'Times New Roman', Times, serif;

        }
        .button{
            text-align: center;

        }
        .button button{
            padding: 3px 9px;
            border-radius: 13px;
            background-color: rgb(172, 147, 179);
            color: rgb(56, 4, 56);
            font-size: 11px;
            margin-top: 2px;
            border: none;
            cursor: pointer;
        }

        .button button:hover{
            background-color: rgb(207, 194, 218); 
            color: rgb(182, 134, 168);

        }

    </style>
</head>
<body>
    <div class="card">
        <div class="image">
            <img width="188" src="https://thumbs.dreamstime.com/b/vivid-sunset-over-utah-mountains-bright-orange-dark-purple-sky-snowy-near-spanish-fork-usa-87331852.jpg">
        </div>

        <div class="capsules">
            <span>Travel</span>
            <span>Mountain</span>
        </div>
        <div class="content">
            <h2>Utah sunsets</h2>
            <p>
                Utah sunsets are renowned for their breathtaking colors, where fiery hues blend dramatically with rugged mountain peaks and desert landscapes. High clouds often catch the last light....
            </p>
        </div>

        <div class="button">
            <button>Read More</button>
        </div>

    </div>
    
</body>
</html>
